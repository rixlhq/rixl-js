name: Build and Release

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    # Caps the job so a hung install, SDK regen or npm publish can't burn
    # GitHub's 6h default. Observed max over the last 41 runs: 1.7 min.
    timeout-minutes: 10
    permissions:
      id-token: write # Required for NPMJS OIDC
      contents: write
      pull-requests: write
      packages: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: "true"
          run-install: "true"

      - name: Format check
        run: vp fmt --check

      - name: Lint and type-check
        run: vp check

      - name: Verify generated SDK is up-to-date
        run: |
          RIXL_GENERATE=true vp pack
          if ! git diff --quiet -- src/generated; then
            echo "::error::src/generated is out of date. Run 'bun run generate' locally and commit the result."
            git diff --stat -- src/generated
            exit 1
          fi

      - parallel:
          - name: Build SDK
            run: vp pack

          - name: Run tests with coverage
            run: vp test --coverage --run

      - name: Report coverage to PR
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: ./coverage/coverage-summary.json
          json-final-path: ./coverage/coverage-final.json
          vite-config-path: ./vite.config.ts
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Release Please
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.BUILD_GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Bun can't publish with NPM OIDC (Trusted Publishing) yet, so we pack with
      # vp and publish with npm.
      - name: Setup Node for npm publish
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: 25
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: vp pack && npm publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
