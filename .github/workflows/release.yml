name: Release

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          cache: "true"
          run-install: "true"

      - name: Format check
        run: vp fmt --check

      - name: Lint and type-check
        run: vp check

      - name: Check examples
        run: vp run examples:check

      - name: Verify generated SDK is up-to-date
        run: |
          RIXL_GENERATE=true vp pack
          if ! git diff --quiet -- src/generated; then
            echo "::error::src/generated is out of date. Run 'vp run generate' locally and commit the result."
            git diff --stat -- src/generated
            exit 1
          fi

      - parallel:
          - name: Build SDK
            run: vp pack

          - name: Run tests with coverage
            run: vp test --coverage --run

      - name: Report coverage to PR
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: ./coverage/coverage-summary.json
          json-final-path: ./coverage/coverage-final.json
          vite-config-path: ./vite.config.ts
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Split from opening the next release PR on purpose. release-please does
      # both in one step, and a failure in the PR phase — a GitHub GraphQL
      # timeout while walking commit history, which is transient and outside our
      # control — marked the whole step failed and skipped publishing, leaving
      # v0.23.1 tagged on GitHub but absent from npm.
      - name: Tag the release
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.BOT_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      - name: Open next release PR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.BOT_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  publish:
    needs: check-and-release
    if: needs.check-and-release.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          cache: "true"
          run-install: "true"

      - name: Build
        run: vp pack

      # npm publish, not `bun publish` or `vp publish`.
      #
      # Bun's npm registry client does not yet support npm's OIDC-based
      # Trusted Publishing (`--provenance`). Publishing without provenance
      # would bypass the SLSA-provenance chain consumers rely on. Since
      # Node and npm are already installed by setup-node above, we use
      # npm publish directly.
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
