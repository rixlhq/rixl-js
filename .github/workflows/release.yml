name: Build and Release

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    # Caps the job so a hung install, SDK regen or npm publish can't burn
    # GitHub's 6h default. Observed max over the last 41 runs: 1.7 min.
    timeout-minutes: 10
    permissions:
      id-token: write # Required for NPMJS OIDC
      contents: write
      pull-requests: write
      packages: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: "true"
          run-install: "true"

      - name: Verify generated SDK is up-to-date
        run: |
          RIXL_GENERATE=true vp pack
          if ! git diff --quiet -- src/generated; then
            echo "::error::src/generated is out of date. Run 'vp run generate' locally and commit the result."
            git diff --stat -- src/generated
            exit 1
          fi

      # The gate, before anything is tagged or published, on PRs and on main
      # alike: vp check (format, lint caps, types), the lint-suppression check,
      # Knip, the examples typecheck, tests with the coverage floor, the build,
      # the size budget (.size-limit.json) and publint. The steps run in order:
      # build and test conflict when run in parallel.
      - name: Gate
        run: vp run ci

      - name: Report coverage to PR
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: ./coverage/coverage-summary.json
          json-final-path: ./coverage/coverage-final.json
          vite-config-path: ./vite.config.ts
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Split from opening the next release PR on purpose. release-please does
      # both in one step, and a failure in the PR phase — a GitHub GraphQL
      # timeout while walking commit history, which is transient and outside our
      # control — marked the whole step failed and skipped publishing, leaving
      # v0.23.1 tagged on GitHub but absent from npm.
      - name: Tag the release
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.BUILD_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      # Bun can't publish with NPM OIDC (Trusted Publishing) yet, so we pack with
      # vp and publish with npm.
      - name: Setup Node for npm publish
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/setup-node@v7
        with:
          # npm validates devEngines.runtime on publish; floating "26" drifts
          # ahead of the pinned version and fails with EBADDEVENGINES.
          node-version-file: .node-version
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: vp pack && npm publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Last, so nothing between the tag and the publish can skip them. The PR
      # only describes commits since the last release; if this fails, the next
      # push to main opens it.
      - name: Open the next release PR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.BUILD_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
