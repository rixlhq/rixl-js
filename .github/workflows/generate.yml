name: Generate SDK

on:
  repository_dispatch:
    types: [regenerate-sdk]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-sdk:
    runs-on: ubuntu-latest
    # Observed max: 1.4 min. The cap only trips if generation or the
    # spec fetch hangs, rather than running to GitHub's 6h default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.BUILD_GITHUB_TOKEN }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: "true"
          run-install: "true"
      - run: vp run generate
      - run: vp check --fix
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "feat(sdk): regenerate based on latest OpenAPI spec"
          file_pattern: "src/**"
