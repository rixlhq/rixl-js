name: Generate SDK

on:
  repository_dispatch:
    types: [regenerate-sdk]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-sdk:
    runs-on: ubuntu-latest
    # Observed max: 1.4 min. The cap only trips if generation or the
    # spec fetch hangs, rather than running to GitHub's 6h default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.BUILD_GITHUB_TOKEN }}
          # Don't leave the write token readable in .git/config while
          # freshly-generated code runs; create-pull-request takes the
          # token via its own input.
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: "true"
          run-install: "true"
      - run: vp run generate
      - run: vp check --fix

      # Opens a PR instead of pushing directly to main — everything goes
      # through reviewable history. BUILD_GITHUB_TOKEN instead of
      # GITHUB_TOKEN — events from the default token never start workflow
      # runs, so the PR would sit at "Expected: waiting for status".
      - name: Create PR with regenerated SDK
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.BUILD_GITHUB_TOKEN }}
          commit-message: "feat(sdk): regenerate based on latest OpenAPI spec"
          branch: generate-sdk/${{ github.sha }}
          title: "feat(sdk): regenerate based on latest OpenAPI spec"
          body: |
            Regenerated `src/` against the latest OpenAPI spec.

            Auto-merge is armed via the `autorelease: pending` label
            (see `automerge.yml`); no required checks are configured on
            main, so it merges as soon as the PR is mergeable — the
            `build-release` gate runs on the resulting push to main.
          labels: "autorelease: pending"
