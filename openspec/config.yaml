schema: spec-driven

context: |
  @rixl/sdk: the TypeScript SDK for the Rixl API, published to npm and used by
  dashboard, internal-dashboard, blog-posts and customer apps.
  src/generated/ is generated from rixlhq/openapi and never edited by hand;
  src/auth/ is the hand-written auth layer (providers, passkeys, PKCE, sessions).
  Toolchain: Vite+ (vp check, vp test, vp pack). Rules: .agents/rules/.
  Removing or changing anything src/index.ts exports is a breaking change.
  Conventional commits; Release Please versions and publishes.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
