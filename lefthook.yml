pre-commit:
  parallel: true
  commands:
    check:
      glob: "*.{js,ts}"
      run: vp check --fix {staged_files} < /dev/null
      stage_fixed: true
    format:
      glob: "*.{json,md,yaml,yml}"
      run: vp fmt --write {staged_files} < /dev/null
      stage_fixed: true

pre-push:
  commands:
    gate:
      run: vp test --run < /dev/null && vp pack < /dev/null && vp run examples:check < /dev/null
