# SDK codegen is deliberately absent: it hits the network and would pull
# regenerated src/generated into unrelated commits (see vite.config.ts). The
# Generate SDK workflow regenerates it, and release.yml fails a PR whose
# src/generated is stale.
pre-commit:
  parallel: true
  commands:
    check:
      glob: "*.{js,ts}"
      run: vp check --fix {staged_files}
      stage_fixed: true
    format:
      glob: "*.{json,md,yaml,yml}"
      run: vp fmt --write {staged_files}
      stage_fixed: true

# The whole suite, not just related tests: it takes seconds, and a library
# change can break any consumer-facing path.
pre-push:
  commands:
    gate:
      run: vp check && vp test --run && vp pack
